<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Advanced To-Do Calendar</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="bg-animation"></div>

  <header class="app-header">
    <h1>✨ Dynamic To-Do Calendar</h1>
    <p>Realtime task management across all your devices</p>
  </header>

  <div class="live-clock" id="liveClock"></div>

  <div class="container">
    <div class="top-bar">
      <div class="stats-card">
        <h2 id="taskCount">0</h2>
        <span>Total Tasks</span>
      </div>
      <div class="stats-card">
        <h2 id="completedCount">0</h2>
        <span>Completed</span>
      </div>
      <div class="stats-card">
        <h2 id="pendingCount">0</h2>
        <span>Pending</span>
      </div>
    </div>

    <div class="progress-section">
      <div class="progress-info">
        <span>Overall Progress</span>
        <span id="progressText">0%</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <div class="header">
      <button id="prevMonth" aria-label="Previous Month">❮</button>
      <h1 id="monthYear"></h1>
      <button id="nextMonth" aria-label="Next Month">❯</button>
    </div>

    <div class="weekdays">
      <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
    </div>
    <div class="calendar" id="calendar"></div>
  </div>

  <div class="modal" id="taskModal">
    <div class="modal-content">
      <span class="close" id="closeModal">&times;</span>
      <h2 id="selectedDate"></h2>
      
      <div class="task-input">
        <input type="text" id="taskInput" placeholder="What needs to be done?" />
        <select id="taskPriority" class="priority-select">
          <option value="low">Low</option>
          <option value="medium" selected>Med</option>
          <option value="high">High</option>
        </select>
        <button id="addTaskBtn">Add</button>
      </div>

      <ul id="taskList"></ul>

      <div class="color-buttons">
        <button onclick="setColor('green')">✅ Productive</button>
        <button onclick="setColor('red')">❌ Busy</button>
        <button onclick="setColor(null)">🔄 Reset Day</button>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="footer-content">
      <p>© 2026 All Rights Reserved</p>
      <p>Developed with ❤️ by <strong>Mr. Dasharath Kumar</strong></p>
    </div>
  </footer>

  <script type="module" src="script.js"></script>
</body>
</html>
